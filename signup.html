<!DOCTYPE html>
<html>
<head>
    <title>Signup</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>

<div class="container">

    <div class="form-box">

        <h2>Create Account</h2>

        <input type="text" id="newUser"
               placeholder="Username">

        <input type="password"
               id="newPass"
               placeholder="Password">

        <button onclick="signup()">
            Register
        </button>

        <p>
            Already Registered?
            <a href="login.html">Login</a>
        </p>

    </div>

</div>

<script src="auth.js"></script>

</body>
</html>
